<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Zalo Form JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .debug { background: #f8f9fa; padding: 15px; border-radius: 4px; margin-top: 20px; }
        .debug h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>🧪 Test Zalo Form JavaScript</h1>
    
    <form id="zaloForm">
        <div class="form-group">
            <label for="zalo_phone">Số điện thoại Zalo:</label>
            <input type="text" id="zalo_phone" name="zalo_phone" value="0972585990" placeholder="0901234567">
        </div>
        
        <div class="form-group">
            <label for="zalo_name">Tên hiển thị:</label>
            <input type="text" id="zalo_name" name="zalo_name" value="Tư vấn viên mới" placeholder="Tư vấn viên">
        </div>
        
        <div class="form-group">
            <label for="zalo_online">Trạng thái:</label>
            <select id="zalo_online" name="zalo_online">
                <option value="1" selected>Đang hoạt động</option>
                <option value="0">Không hoạt động</option>
            </select>
        </div>
        
        <button type="submit">Lưu cài đặt</button>
        <button type="button" onclick="resetForm()">Reset về mặc định</button>
    </form>
    
    <div class="debug">
        <h3>🔍 Debug Info:</h3>
        <div id="debugInfo">
            <p><strong>Form values:</strong></p>
            <p id="formValues"></p>
            <p><strong>Events logged:</strong></p>
            <div id="eventLog"></div>
        </div>
    </div>
    
    <script>
        // Log tất cả events
        function logEvent(event, details) {
            const eventLog = document.getElementById('eventLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>${timestamp}</strong> - ${event}: ${details}`;
            eventLog.appendChild(logEntry);
        }
        
        // Update form values display
        function updateFormValues() {
            const formValues = document.getElementById('formValues');
            const phone = document.getElementById('zalo_phone').value;
            const name = document.getElementById('zalo_name').value;
            const online = document.getElementById('zalo_online').value;
            
            formValues.innerHTML = `
                zalo_phone: ${phone}<br>
                zalo_name: ${name}<br>
                zalo_online: ${online}
            `;
        }
        
        // Form submit handler
        document.getElementById('zaloForm').addEventListener('submit', function(e) {
            e.preventDefault();
            logEvent('Form Submit', 'Form submitted');
            
            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            logEvent('Form Data', JSON.stringify(data, null, 2));
            
            // Simulate save
            alert('Form submitted with: ' + JSON.stringify(data, null, 2));
        });
        
        // Input change handlers
        document.getElementById('zalo_phone').addEventListener('input', function(e) {
            logEvent('Phone Input', `Changed to: ${e.target.value}`);
            updateFormValues();
        });
        
        document.getElementById('zalo_name').addEventListener('input', function(e) {
            logEvent('Name Input', `Changed to: ${e.target.value}`);
            updateFormValues();
        });
        
        document.getElementById('zalo_online').addEventListener('change', function(e) {
            logEvent('Online Change', `Changed to: ${e.target.value}`);
            updateFormValues();
        });
        
        // Reset function
        function resetForm() {
            logEvent('Reset Button', 'Reset button clicked');
            
            document.getElementById('zalo_phone').value = '0901234567';
            document.getElementById('zalo_name').value = 'Tư vấn viên';
            document.getElementById('zalo_online').value = '1';
            
            logEvent('Form Reset', 'Form reset to default values');
            updateFormValues();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            logEvent('Page Load', 'Page loaded');
            updateFormValues();
        });
        
        // Monitor for any programmatic changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'value') {
                    logEvent('Value Changed', `Attribute ${mutation.attributeName} changed to: ${mutation.target.value}`);
                }
            });
        });
        
        // Observe form inputs
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            observer.observe(input, { attributes: true, attributeFilter: ['value'] });
        });
    </script>
</body>
</html>
