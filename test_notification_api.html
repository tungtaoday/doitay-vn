<!DOCTYPE html>
<html>
<head>
    <title>Test Notification API</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Notification API</h1>
    
    <div class="test-section">
        <h3>1. Test API Connection</h3>
        <button onclick="testAPI()">Test /user/notifications/header-data</button>
        <div id="apiResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Create Test Notification</h3>
        <button onclick="createTestNotification()">Create Test Notification</button>
        <div id="createResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Test Notification Bell</h3>
        <div id="testBell">
            <!-- Copy paste notification bell component here -->
            <div class="notification-bell" id="notificationBell">
                <div class="dropdown">
                    <a class="notification-toggle" href="#" id="notificationToggle">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                    </a>
                    
                    <div class="dropdown-menu notification-dropdown">
                        <div class="notification-header">
                            <h6>Notifications</h6>
                        </div>
                        
                        <div class="notification-list" id="notificationList">
                            <div class="notification-loading text-center py-3">
                                <i class="fas fa-spinner fa-spin"></i> Loading...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button onclick="testNotificationBell()">Load Notifications</button>
        <div id="bellResult" class="result"></div>
    </div>

    <script>
        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = new Date().toLocaleTimeString() + ': ' + message;
            element.className = 'result ' + (isError ? 'error' : 'success');
        }
        
        function testAPI() {
            log('apiResult', 'Testing API...', false);
            
            fetch('/user/notifications/header-data', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                log('apiResult', 'API Success!\n' + JSON.stringify(data, null, 2), false);
            })
            .catch(error => {
                log('apiResult', 'API Error: ' + error.message, true);
            });
        }
        
        function createTestNotification() {
            log('createResult', 'Creating test notification...', false);
            
            // This would require a create notification endpoint
            log('createResult', 'Test notification creation requires backend endpoint', false);
        }
        
        function testNotificationBell() {
            log('bellResult', 'Testing notification bell...', false);
            
            // Simplified notification bell test
            fetch('/user/notifications/header-data', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateNotificationBell(data.unread_count, data.notifications);
                    log('bellResult', `Bell updated! Unread: ${data.unread_count}, Notifications: ${data.notifications.length}`, false);
                } else {
                    log('bellResult', 'Bell error: ' + (data.error || 'Unknown error'), true);
                }
            })
            .catch(error => {
                log('bellResult', 'Bell fetch error: ' + error.message, true);
            });
        }
        
        function updateNotificationBell(count, notifications) {
            const badge = document.getElementById('notificationBadge');
            const list = document.getElementById('notificationList');
            
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            
            if (notifications.length === 0) {
                list.innerHTML = '<div class="notification-empty">No notifications</div>';
            } else {
                list.innerHTML = notifications.map(notif => `
                    <div class="notification-item ${!notif.is_read ? 'unread' : ''}">
                        <div class="notification-content">
                            <div class="notification-title">${notif.title}</div>
                            <div class="notification-message">${notif.message}</div>
                            <div class="notification-time">${notif.time_ago}</div>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        // Auto test on page load
        window.addEventListener('load', function() {
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
