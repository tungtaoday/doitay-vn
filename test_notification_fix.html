<!DOCTYPE html>
<html>
<head>
    <title>Test Notification Fix</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Notification System Fix Test</h1>
    
    <div class="test-section">
        <h3>1. CSRF Token Check</h3>
        <div id="csrfStatus"></div>
        <button onclick="checkCSRF()">Check CSRF Token</button>
    </div>
    
    <div class="test-section">
        <h3>2. Header Data API Test</h3>
        <div id="headerStatus"></div>
        <button onclick="testHeaderData()">Test Header Data</button>
    </div>
    
    <div class="test-section">
        <h3>3. Mark as Read API Test</h3>
        <input type="number" id="testId" placeholder="Notification ID" value="1">
        <button onclick="testMarkAsRead()">Test Mark as Read</button>
        <div id="markStatus"></div>
    </div>
    
    <div class="test-section">
        <h3>4. Response Log</h3>
        <div id="responseLog"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('responseLog');
            const timestamp = new Date().toLocaleTimeString();
            const className = type; // success, error, info
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('responseLog').innerHTML = '';
        }
        
        function checkCSRF() {
            const statusDiv = document.getElementById('csrfStatus');
            const token = document.querySelector('meta[name="csrf-token"]');
            
            if (token && token.getAttribute('content')) {
                const tokenValue = token.getAttribute('content');
                statusDiv.innerHTML = `<div class="success">✅ CSRF Token Found: ${tokenValue.substring(0, 20)}...</div>`;
                log('CSRF token found and accessible', 'success');
            } else {
                statusDiv.innerHTML = `<div class="error">❌ CSRF Token Not Found</div>`;
                log('CSRF token missing!', 'error');
            }
        }
        
        async function testHeaderData() {
            const statusDiv = document.getElementById('headerStatus');
            statusDiv.innerHTML = '<div class="info">Testing header data...</div>';
            log('Testing header data API...');
            
            try {
                const response = await fetch('/user/notifications/header-data', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                log(`Header data response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<div class="success">✅ Header Data Success</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Header data API working correctly', 'success');
                } else {
                    const text = await response.text();
                    statusDiv.innerHTML = `<div class="error">❌ Header Data Error: ${response.status}</div><pre>${text.substring(0, 200)}...</pre>`;
                    log(`Header data error: ${response.status}`, 'error');
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ Network Error: ${error.message}</div>`;
                log(`Network error: ${error.message}`, 'error');
            }
        }
        
        async function testMarkAsRead() {
            const statusDiv = document.getElementById('markStatus');
            const notificationId = document.getElementById('testId').value;
            
            if (!notificationId) {
                statusDiv.innerHTML = '<div class="error">❌ Please enter notification ID</div>';
                return;
            }
            
            statusDiv.innerHTML = '<div class="info">Testing mark as read...</div>';
            log(`Testing mark as read for ID: ${notificationId}`);
            
            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                
                const response = await fetch(`/user/notifications/${notificationId}/read`, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                log(`Mark as read response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<div class="success">✅ Mark as Read Success</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Mark as read API working correctly', 'success');
                } else if (response.status === 419) {
                    statusDiv.innerHTML = `<div class="error">❌ CSRF Token Mismatch (419)</div>`;
                    log('CSRF token mismatch - need to refresh page', 'error');
                } else if (response.status === 401) {
                    statusDiv.innerHTML = `<div class="error">❌ Not Authenticated (401)</div>`;
                    log('Authentication required - need to login', 'error');
                } else {
                    const text = await response.text();
                    statusDiv.innerHTML = `<div class="error">❌ Error ${response.status}</div><pre>${text.substring(0, 200)}...</pre>`;
                    log(`API error: ${response.status}`, 'error');
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ Network Error: ${error.message}</div>`;
                log(`Network error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run checks on load
        window.onload = function() {
            log('Page loaded, running initial checks...');
            checkCSRF();
            setTimeout(testHeaderData, 500);
        };
    </script>
</body>
</html>
