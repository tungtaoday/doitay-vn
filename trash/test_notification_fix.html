<!DOCTYPE html>
<html>
<head>
    <title>Test Notification Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-box { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔔 Test Notification API Fix</h1>
    
    <div class="test-box">
        <h3>Test Corrected API URL</h3>
        <button onclick="testAPI()">Test /user/notifications/header-data</button>
        <div id="result" class="result"></div>
    </div>

    <div class="test-box">
        <h3>Test Bell Simulation</h3>
        <div style="position: relative; display: inline-block;">
            <i style="font-size: 24px; color: #007bff;">🔔</i>
            <span id="badge" style="position: absolute; top: -8px; right: -8px; background: #dc3545; color: white; border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 12px;"></span>
        </div>
        <button onclick="updateBadge()">Update Badge from API</button>
    </div>

    <script>
        function log(message, isError = false) {
            const element = document.getElementById('result');
            element.textContent = message;
            element.className = 'result ' + (isError ? 'error' : 'success');
        }

        async function testAPI() {
            try {
                log('Testing API...');
                
                const response = await fetch('/user/notifications/header-data', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'same-origin'
                });
                
                if (response.status === 401) {
                    log('❌ Not authenticated. Please login first.', true);
                    return;
                }
                
                if (!response.ok) {
                    const text = await response.text();
                    log(`❌ HTTP ${response.status}: ${response.statusText}\nResponse: ${text}`, true);
                    return;
                }
                
                const data = await response.json();
                log(`✅ SUCCESS!\nStatus: ${response.status}\nData: ${JSON.stringify(data, null, 2)}`);
                
                // Update badge if successful
                if (data.success && data.unread_count !== undefined) {
                    const badge = document.getElementById('badge');
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, true);
            }
        }

        async function updateBadge() {
            try {
                const response = await fetch('/user/notifications/header-data', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const badge = document.getElementById('badge');
                    
                    if (data.success && data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'flex';
                        alert(`✅ Badge updated! Found ${data.unread_count} notifications`);
                    } else {
                        badge.style.display = 'none';
                        alert('ℹ️ No unread notifications');
                    }
                } else {
                    alert('❌ API Error: ' + response.status);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
        
        // Auto test on page load
        window.onload = function() {
            console.log('Page loaded, testing API...');
            setTimeout(testAPI, 1000);
        };
    </script>
</body>
</html>
